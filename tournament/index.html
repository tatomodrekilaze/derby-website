<!doctype html>
<html lang="ka" data-game="snooker">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DERBY · ტურნირი LIVE</title>
  <meta name="description" content="DERBY ბილიარდის ტურნირი: მოთამაშეები, ბადე და შედეგები პირდაპირ ეთერში.">
  <meta name="theme-color" content="#05190f">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Noto+Sans+Georgian:wdth,wght@62.5..100,500..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tv.css?v=13">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="stage__felt"></div>

      <header class="tv-head">
        <div class="tv-brand"><img src="../assets/img/crest.png" alt="DERBY"></div>
        <div class="tv-titles">
          <h1 class="tv-title" id="tvTitle">DERBY Snooker Cup</h1>
          <div class="tv-sub" id="tvSub">სნუკერის ტურნირი</div>
        </div>
        <div class="tv-meta">
          <span class="live-pill" id="statePill"><i></i><span>LIVE</span></span>
          <b class="tv-clock" id="tvClock">00:00</b>
        </div>
      </header>

      <main class="tv-main" id="tvMain">
        <div class="tv-wait"><img src="../assets/img/crest.png" alt=""><p>იტვირთება</p></div>
      </main>

      <div class="ann" id="ann"><span class="ann__k" id="annK"></span><span class="ann__v" id="annV"></span></div>

      <div class="brk" id="brk">
        <img src="../assets/img/crest.png" alt="">
        <p class="brk__k">შესვენება</p>
        <b class="brk__t" id="brkT">10:00</b>
        <p class="brk__m" id="brkM"></p>
        <small class="brk__u" id="brkU"></small>
      </div>

      <div class="toast" id="toast"><span class="toast__k" id="toastK"></span><span class="toast__v" id="toastV"></span></div>

      <div class="champ" id="champ" aria-live="polite">
        <canvas class="champ__balls" id="champBalls"></canvas>
        <div class="champ__inner">
          <img src="../assets/img/crest.png" alt="">
          <p class="champ__label">ჩემპიონი</p>
          <h2 class="champ__name" id="champName"></h2>
          <p class="champ__sub" id="champSub"></p>
        </div>
      </div>

      <div class="conn" id="conn"><i></i><span>კავშირის აღდგენა</span></div>
    </div>
  </div>

  <script src="../js/billiards.js"></script>
  <script src="shared.js?v=13"></script>
  <script src="tv.js?v=13"></script>
</body>
</html>
